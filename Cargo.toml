[workspace]
resolver = "3"
members = ["crates/esp32", "crates/protocol"]
default-members = ["crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
ciborium = { version = "0.2.2", default-features = false }
ciborium-io = { version = "0.2.2", features = ["alloc"] }
log = "0.4.35"
protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
