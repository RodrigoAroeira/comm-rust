[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --chip esp32s3"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --chip esp32"

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_SYS_ROOT_CRATE = "esp32"
ESP_IDF_VERSION = "v5.5.5"
